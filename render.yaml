databases:
  - name: cleanroute-db
    databaseName: cleanroute_db
    user: cleanroute_user
    plan: free

services:
  # 1. Django REST API Backend Service
  - type: web
    name: cleanroute-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn --config gunicorn.conf.py config.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cleanroute-db
          property: connectionString
      - key: OPENROUTESERVICE_API_KEY
        sync: false

  # 2. Static Frontend Service
  - type: web
    name: cleanroute-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    buildCommand: ""
